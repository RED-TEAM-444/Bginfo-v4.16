# ============================================================
#  config.ini  –  Network Relationship Analyzer Configuration
# ============================================================

[graph]
directed          = false
weighted          = false
allow_self_loops  = false
allow_multi_edges = false

[csv]
source_col  = 0
target_col  = 1
weight_col  = -1       # -1 = no weight column
delimiter   = ,
has_header  = true

[algorithms]
pagerank_iter     = 100
pagerank_damping  = 0.85
pagerank_tol      = 1e-6
eigen_iter        = 100
lp_max_iter       = 100
louvain_max_iter  = 100
use_louvain       = false   # true = Louvain, false = Label Propagation
link_pred_topk    = 20

[anomaly]
density_threshold = 0.55
zscore_threshold  = 2.5
min_cluster_size  = 3

[output]
format      = text          # text | csv | json
colour      = true
verbose     = false
top_k       = 20
log_file    = nra.log
log_level   = info          # debug | info | warn | error
